# Lean 4 formalizations accompanying the manuscript.
# Mathlib is pinned to the release tag matching the toolchain in lean-toolchain; the two
# move together, and lake-manifest.json fixes the exact revision.
name = "Multiway"
version = "0.1.0"
defaultTargets = ["Multiway"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "Multiway"
